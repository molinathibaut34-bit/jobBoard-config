services:
  postgres:
    image: postgres:16-alpine
    container_name: jobboard-postgres
    environment:
      POSTGRES_DB: jobboard
      POSTGRES_USER: admin_jobboard_user
      POSTGRES_PASSWORD: admin_jobboard_password
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin_jobboard_user -d jobboard"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - jobboard-network

  minio:
    image: bitnamilegacy/minio:latest
    container_name: jobboard-minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      MINIO_DEFAULT_BUCKETS: jobboard-photos:download
      MINIO_BROWSER: "on"
      MINIO_API_PORT_NUMBER: "9000"
      MINIO_CONSOLE_PORT_NUMBER: "9001"
      MINIO_SERVER_URL: http://localhost:9000
      MINIO_BROWSER_REDIRECT_URL: http://localhost:9001
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/bitnami/minio/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - jobboard-network

volumes:
  postgres_data:
    driver: local
  minio_data:
    driver: local

networks:
  jobboard-network:
    driver: bridge
